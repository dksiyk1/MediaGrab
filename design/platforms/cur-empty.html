<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="cur.css"></head><body>
<div class="frame">
  <aside class="side">
    <div class="brand"><span class="nm">MediaGrab</span></div>

    <div class="glabel">资料库</div>
    <div class="item on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
      全部解析</div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="4.5" width="17" height="15" rx="2.4"/><path d="M3.5 15l4.5-4.5 3.5 3.5 3-3 6 5.5"/></svg>图片</div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5.5" width="12" height="13" rx="2.4"/><path d="M15.5 10l5-3v10l-5-3"/></svg>视频</div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12.5l5 5L20 6.5"/></svg>已完成</div>

    <div class="glabel">工具</div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v3M12 17.5v3"/></svg>资源嗅探</div>

    <div class="glabel">下载</div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.5v11M7.5 10.5L12 15l4.5-4.5M4 20.5h16"/></svg>下载队列</div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.2l3.4 2"/></svg>下载历史</div>

    <div class="sidefoot">
      <div class="diskrow"><span>磁盘</span><span>63 GB 可用</span></div>
      <div class="diskbar"><i></i></div>
      <div class="setrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4L5.5 18.5"/></svg>
        设置</div>
    </div>
  </aside>

  <main class="content">
    <div class="dragzone"></div>
    <div class="toolbar">
      <h1>全部解析</h1>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        搜索作品
      </div>
    </div>

    <div class="imp">
      <div class="field">粘贴抖音 / B站 / 小红书链接，支持一次粘贴多条
        <div class="paste">粘贴</div>
      </div>
      <div class="go">解析</div>
    </div>

    <div class="empty"><span>粘贴一个链接开始解析</span></div>

    <div class="status">
      <div class="srow">
        <span class="sl">保存到</span>
        <div class="diredit">C:\Users\a1358\Downloads\Med</div>
        <div class="sbtn">更改</div>
        <div class="iconbtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7.5h6l2 2.5h10v9H3z"/></svg></div>
        <span class="sl" style="margin-left:6px">下载方式</span>
        <div class="combo">内置
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="3" style="margin-left:auto"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="sw" style="margin-left:6px"><i></i></div>
        <span class="sl">下载后打开</span>
        <span class="ready">就绪</span>
      </div>
      <div class="sprog"></div>
    </div>
  </main>

  <div class="caps">
    <div class="cap" title="最小化">
      <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0" y="4.5" width="10" height="1" fill="currentColor"/></svg>
    </div>
    <div class="cap" title="最大化">
      <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
    </div>
    <div class="cap close" title="关闭">
      <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
    </div>
  </div>
</div>
</body></html>

<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="cur.css">
<style>
html,body{width:1180px;height:300px;padding:0;display:block;
  background:linear-gradient(140deg,#3C4553 0%,#4B5566 45%,#39424E 100%)}
.sheet{width:1180px;height:300px;background:#FBFBFC;padding:0 40px;display:flex;flex-direction:column}
.hd{height:60px;flex:0 0 60px;display:flex;align-items:center;border-bottom:1px solid rgba(0,0,0,.08)}
.hd .t{font-size:12.5px;font-weight:600;letter-spacing:.16em;color:#1D1D1F}
.hd .s{font-size:11px;color:#8E8E93;margin-left:14px;letter-spacing:.03em}
.hd .v{margin-left:auto;font-size:10px;color:#8E8E93;letter-spacing:.12em;
  border:1px solid rgba(0,0,0,.12);padding:2px 8px;border-radius:3px}
.body{flex:1;display:flex;align-items:center;gap:34px}
.states{display:flex;border:1px solid rgba(0,0,0,.10);border-radius:10px;overflow:hidden;background:#fff;
  flex:0 0 auto}
.st{width:104px;height:136px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:9px;border-right:1px solid rgba(0,0,0,.07)}
.st:last-child{border-right:0}
.st .lb{font-size:10px;color:#8E8E93;text-align:center;line-height:1.4}
.st .box{width:46px;height:46px;display:flex;align-items:center;justify-content:center;color:#1B1B1B}
.st.hov .box{background:rgba(0,0,0,.0605)}
.st.cl .box{background:#C42B1C;color:#fff;border-radius:6px}
.st.pr .box{background:#B12A1C;color:rgba(255,255,255,.9);border-radius:6px}
.mini{width:76px;height:52px;border-radius:9px;overflow:hidden;position:relative;background:#fff;
  border:1px solid rgba(0,0,0,.10);box-shadow:0 3px 10px rgba(0,0,0,.10)}
.mini .cornerbtn{position:absolute;right:0;top:0;width:26px;height:26px;background:#C42B1C;
  border-top-right-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff}
.mini .ln{position:absolute;left:8px;top:9px;width:26px;height:2px;background:rgba(0,0,0,.16);
  border-radius:1px}
.mini .ln2{position:absolute;left:8px;top:16px;width:16px;height:2px;background:rgba(0,0,0,.09);
  border-radius:1px}
.spec{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:9px 28px;align-content:center}
.kv{display:flex;gap:9px;font-size:10.5px;color:#4A4A4F;line-height:1.5;letter-spacing:.01em}
.kv b{flex:0 0 62px;color:#9A9AA0;font-weight:400}
</style></head><body>
<div class="sheet">
  <div class="hd">
    <span class="t">窗口控制</span>
    <span class="s">Windows 11 标准三键 · 替换原有红绿灯</span>
    <span class="v">46 × 46</span>
  </div>

  <div class="body">
    <div class="states">
      <div class="st">
        <div class="box"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0" y="4.5" width="10" height="1" fill="currentColor"/></svg></div>
        <span class="lb">默认</span>
      </div>
      <div class="st hov">
        <div class="box"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0" y="4.5" width="10" height="1" fill="currentColor"/></svg></div>
        <span class="lb">悬停<br>黑 6%</span>
      </div>
      <div class="st cl">
        <div class="box"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg></div>
        <span class="lb">关闭悬停<br>#C42B1C</span>
      </div>
      <div class="st pr">
        <div class="box"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg></div>
        <span class="lb">按下</span>
      </div>
      <div class="st">
        <div class="mini">
          <div class="ln"></div><div class="ln2"></div>
          <div class="cornerbtn"><svg width="8" height="8" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.2"/></svg></div>
        </div>
        <span class="lb">跟随窗口<br>12px 圆角裁切</span>
      </div>
    </div>

    <div class="spec">
      <div class="kv"><b>命中区</b>46 × 46，贴右上</div>
      <div class="kv"><b>字形</b>10 × 10，1px 描边</div>
      <div class="kv"><b>悬停</b>黑 6%，不加圆角</div>
      <div class="kv"><b>关闭</b>#C42B1C，字形转白</div>
      <div class="kv"><b>按下</b>再深一档，字 90%</div>
      <div class="kv"><b>拖动</b>标题行除按钮外可拖</div>
      <div class="kv"><b>双击</b>最大化 / 还原</div>
      <div class="kv"><b>顺序</b>最小化·最大化·关闭</div>
    </div>
  </div>
</div>
</body></html>

<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
:root{--ink:#141416;--ink3:#93939A;--line:#E4E4DE;
--f:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",sans-serif;--m:Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1120px;background:#FAFAF7;font-family:var(--f);padding:26px 32px;color:#141416}
.row{display:flex;align-items:center;gap:26px;padding:16px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.big{width:150px;height:150px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.05);flex:0 0 150px}
.sm{display:flex;gap:16px;align-items:flex-end;flex:0 0 190px}
.sm div{display:flex;flex-direction:column;gap:6px;align-items:center}
.sm span{font-family:var(--m);font-size:8px;color:var(--ink3)}
.t{width:150px;height:150px;border-radius:34px;background:#0D0D0F;display:flex;align-items:center;justify-content:center;flex:0 0 150px}
.i{flex:1;font-size:11px;color:#5B5B63;line-height:1.7}
.i b{display:block;color:#141416;font-size:12px;margin-bottom:4px}
</style></head><body>

<div class="row">
  <div class="big">
    <svg width="112" height="112" viewBox="0 0 24 24" fill="none">
      <path d="M4 11.4V19.6H20V11.4H17.2L16.4 16.8H7.6L6.8 11.4Z" fill="#141416"/>
      <rect x="8.5" y="2.6" width="7" height="7" fill="#141416"/>
    </svg>
  </div>
  <div class="sm">
    <div><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M4 11.4V19.6H20V11.4H17.2L16.4 16.8H7.6L6.8 11.4Z" fill="#141416"/><rect x="8.5" y="2.6" width="7" height="7" fill="#141416"/></svg><span>32</span></div>
    <div><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3.4 11V20H20.6V11H17L16.2 17H7.8L7 11Z" fill="#141416"/><rect x="8.2" y="1.8" width="7.6" height="7.6" fill="#141416"/></svg><span>16</span></div>
  </div>
  <div class="t">
    <svg width="78" height="78" viewBox="0 0 24 24" fill="none"><path d="M4 11.4V19.6H20V11.4H17.2L16.4 16.8H7.6L6.8 11.4Z" fill="#fff"/><rect x="8.5" y="2.6" width="7" height="7" fill="#fff"/></svg>
  </div>
  <div class="i"><b>V1 现状</b>臂高 8.2u，块 7u 悬在上方 1.8u。128 下像显示器＋支架，托盘被读成两条腿。</div>
</div>

<div class="row">
  <div class="big">
    <svg width="112" height="112" viewBox="0 0 24 24" fill="none">
      <path d="M4 15.2V19.6H20V15.2H17.2V16.8H6.8V15.2Z" fill="#141416"/>
      <rect x="8.5" y="3" width="7" height="7" fill="#141416"/>
      <rect x="4" y="15.2" width="2.8" height="4.4" fill="#141416"/>
    </svg>
  </div>
  <div class="sm">
    <div><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M4 15.2V19.6H20V15.2H17.2L16.4 16.8H7.6L6.8 15.2Z" fill="#141416"/><rect x="8.5" y="3" width="7" height="7" fill="#141416"/></svg><span>32</span></div>
    <div><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3.4 14.8V20.2H20.6V14.8H17L16.2 17.4H7.8L7 14.8Z" fill="#141416"/><rect x="8.2" y="2.2" width="7.6" height="7.6" fill="#141416"/></svg><span>16</span></div>
  </div>
  <div class="t">
    <svg width="78" height="78" viewBox="0 0 24 24" fill="none"><path d="M4 15.2V19.6H20V15.2H17.2L16.4 16.8H7.6L6.8 15.2Z" fill="#fff"/><rect x="8.5" y="3" width="7" height="7" fill="#fff"/></svg>
  </div>
  <div class="i"><b>V2 浅盘</b>托盘压到 4.4u 高，块抬到 3u。像「块落在盘子上」，仍缺"接住"的感觉。</div>
</div>

<div class="row">
  <div class="big">
    <svg width="112" height="112" viewBox="0 0 24 24" fill="none">
      <path d="M4 13V19.6H20V13H17.2L16.4 16.8H7.6L6.8 13Z" fill="#141416"/>
      <rect x="8.6" y="8.4" width="6.8" height="7" fill="#141416"/>
    </svg>
  </div>
  <div class="sm">
    <div><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M4 13V19.6H20V13H17.2L16.4 16.8H7.6L6.8 13Z" fill="#141416"/><rect x="8.6" y="8.4" width="6.8" height="7" fill="#141416"/></svg><span>32</span></div>
    <div><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3.4 12.6V20.2H20.6V12.6H17L16.2 17.2H7.8L7 12.6Z" fill="#141416"/><rect x="8.3" y="7.8" width="7.4" height="7.2" fill="#141416"/></svg><span>16</span></div>
  </div>
  <div class="t">
    <svg width="78" height="78" viewBox="0 0 24 24" fill="none"><path d="M4 13V19.6H20V13H17.2L16.4 16.8H7.6L6.8 13Z" fill="#fff"/><rect x="8.6" y="8.4" width="6.8" height="7" fill="#fff"/></svg>
  </div>
  <div class="i"><b>V3 半入</b>块已过开口、还在往下走。语义最准，但 16px 下块与托盘臂会粘住。</div>
</div>

<div class="row">
  <div class="big">
    <svg width="112" height="112" viewBox="0 0 24 24" fill="none">
      <path d="M4 12.6V19.4H20V12.6H17.2V16.6H6.8V12.6Z" fill="#141416"/>
      <rect x="8.6" y="3.4" width="6.8" height="6.8" fill="#141416"/>
      <rect x="4" y="12.6" width="2.8" height="6.8" fill="#141416"/>
      <rect x="17.2" y="12.6" width="2.8" height="6.8" fill="#141416"/>
    </svg>
  </div>
  <div class="sm">
    <div><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M4 12.6V19.4H20V12.6H17.2V16.6H6.8V12.6Z" fill="#141416"/><rect x="8.6" y="3.4" width="6.8" height="6.8" fill="#141416"/></svg><span>32</span></div>
    <div><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3.4 12.2V20H20.6V12.2H17V17H7V12.2Z" fill="#141416"/><rect x="8.3" y="2.8" width="7.4" height="7.4" fill="#141416"/></svg><span>16</span></div>
  </div>
  <div class="t">
    <svg width="78" height="78" viewBox="0 0 24 24" fill="none"><path d="M4 12.6V19.4H20V12.6H17.2V16.6H6.8V12.6Z" fill="#fff"/><rect x="8.6" y="3.4" width="6.8" height="6.8" fill="#fff"/></svg>
  </div>
  <div class="i"><b>V4 厚壁浅斗</b>壁加到 2.8u、斗高 6.8u、块 6.8u，缝 2.4u。128 读作"斗＋块"，但整体偏方，像盒子。</div>
</div>

</body></html>
